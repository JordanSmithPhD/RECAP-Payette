# Lightweight environment for tests, schemas, and tabular activity examples.
name: recap-payette
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0,<3
  - pandas>=2.2,<4
  - pyarrow>=18,<24
  - pillow>=11,<13
  - pyyaml>=6,<7
  - scipy>=1.13,<2
  - pytest>=8,<10
  - ruff>=0.11,<0.16
  - pip
  - pip:
      - -e .
