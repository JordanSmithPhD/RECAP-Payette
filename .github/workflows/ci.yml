name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[tables,dev]'
      - name: Compile source
        run: python -m compileall -q project_paths.py pipeline src tests tools
      - name: Check command help
        run: |
          for file in pipeline/*.py; do
            python "$file" --help >/dev/null
          done
      - name: Test scientific contracts
        run: python -m pytest -q
      - name: Lint likely runtime failures
        run: python -m ruff check .
      - name: Audit public release contents
        run: python tools/audit_public_release.py
