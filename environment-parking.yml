# Direct dependency inventory for the recommended parking-opportunity workflow.
# Solve and retain a platform-specific conda-lock file with each scientific run.
name: recap-payette-parking
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2.0,<3
  - pandas>=2.2,<4
  - pyarrow>=18,<24
  - pyyaml>=6,<7
  - scipy>=1.13,<2
  - pillow>=11,<13
  - matplotlib>=3.9,<4
  - tqdm>=4.66,<5
  - tabulate>=0.9,<1
  - requests>=2.32,<3
  - geopandas>=1.0,<2
  - fiona>=1.10,<2
  - gdal>=3.9,<4
  - pyogrio>=0.10,<1
  - pyproj>=3.7,<4
  - rasterio>=1.4,<2
  - rioxarray>=0.18,<1
  - rtree>=1.3,<2
  - shapely>=2.0,<3
  - earthengine-api>=1.4,<2
  - geemap>=0.35,<1
  - folium>=0.19,<1
  - pynhd>=0.19,<1
  - py3dep>=0.18,<1
  - pytorch>=2.5,<3
  - torchvision>=0.20,<1
  - albumentations>=2.0,<3
  - opencv>=4.10,<5
  - segmentation-models-pytorch>=0.4,<1
  - conda-lock>=3,<4
  - pytest>=8,<10
  - ruff>=0.11,<0.16
  - pip
  - pip:
      - -e .
      # Chosen public baseline; the historical Colab revision is unknown.
      - git+https://github.com/facebookresearch/segment-anything.git@6fdee8f2727f4506cfbbe553e23b895e27956588
