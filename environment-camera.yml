# Direct packages used by the successful 2026-08-28 macOS arm64 replay,
# plus the public annotation tool. The operational checkpoint is not distributed.
name: recap-payette-camera
channels:
  - conda-forge
dependencies:
  - python=3.11.14
  - numpy=2.4.2
  - pandas=3.0.1
  - pyarrow=23.0.1
  - pillow=12.1.1
  - pyyaml=6.0.3
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - tqdm=4.67.3
  - requests=2.32.5
  - openpyxl=3.1.5
  - tabulate=0.9.0
  - pytest>=8,<10
  - ruff>=0.11,<0.16
  - pip
  - pip:
      - -e .
      - opencv-python==4.13.0.92
      - scipy==1.17.0
      - torch==2.10.0
      - torchvision==0.25.0
      - ultralytics==8.4.14
      - fiftyone==1.13.1
